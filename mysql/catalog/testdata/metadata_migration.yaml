- description: Views, triggers, and stored procedures
  oldSchema: |
    CREATE TABLE products (
        id INT NOT NULL AUTO_INCREMENT,
        name VARCHAR(100) NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        stock INT DEFAULT 0,
        PRIMARY KEY (id),
        INDEX idx_name (name)
    ) ENGINE=InnoDB;

    CREATE TABLE orders (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        quantity INT NOT NULL,
        total DECIMAL(10, 2),
        order_date DATETIME DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        CONSTRAINT fk_product FOREIGN KEY (product_id) REFERENCES products(id)
    ) ENGINE=InnoDB;

    CREATE VIEW product_inventory AS
    SELECT
        p.id,
        p.name,
        p.price,
        p.stock,
        COALESCE(SUM(o.quantity), 0) AS total_ordered
    FROM products p
    LEFT JOIN orders o ON p.id = o.product_id
    GROUP BY p.id, p.name, p.price, p.stock;

    CREATE VIEW low_stock_products AS
    SELECT * FROM products WHERE stock < 10;

    CREATE TRIGGER update_order_total
    BEFORE INSERT ON orders
    FOR EACH ROW
    BEGIN
        DECLARE product_price DECIMAL(10, 2);
        SELECT price INTO product_price FROM products WHERE id = NEW.product_id;
        SET NEW.total = NEW.quantity * product_price;
    END;

    CREATE PROCEDURE GetProductInventory(IN product_name VARCHAR(100))
    BEGIN
        SELECT * FROM product_inventory
        WHERE name LIKE CONCAT('%', product_name, '%');
    END;
  newSchema: |
    CREATE TABLE products (
        id INT NOT NULL AUTO_INCREMENT,
        name VARCHAR(100) NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        stock INT DEFAULT 0,
        PRIMARY KEY (id),
        INDEX idx_name (name)
    ) ENGINE=InnoDB;

    CREATE TABLE orders (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        quantity INT NOT NULL,
        total DECIMAL(10, 2),
        order_date DATETIME DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        CONSTRAINT fk_product FOREIGN KEY (product_id) REFERENCES products(id)
    ) ENGINE=InnoDB;
