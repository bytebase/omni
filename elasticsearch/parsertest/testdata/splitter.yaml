- description: empty statement
  statement: ""
  expectedCount: 0

- description: whitespace only
  statement: "   \n\t  "
  expectedCount: 0

- description: single GET request
  statement: "GET _search"
  expectedCount: 1
  statements:
    - text: "GET _search"
      start:
        line: 1
        column: 1
      end:
        line: 1
        column: 12
      range:
        start: 0
        end: 11

- description: single POST request with body
  statement: "POST /my_index/_search\n{\n  \"query\": {\n    \"match_all\": {}\n  }\n}"
  expectedCount: 1
  statements:
    - text: "POST /my_index/_search\n{\n  \"query\": {\n    \"match_all\": {}\n  }\n}"
      start:
        line: 1
        column: 1

- description: multiple requests
  statement: "GET _search\nPOST _test_index"
  expectedCount: 2
  statements:
    - text: "GET _search"
      start:
        line: 1
        column: 1
      end:
        line: 1
        column: 12
      range:
        start: 0
        end: 11
    - text: "POST _test_index"
      start:
        line: 2
        column: 1
      end:
        line: 2
        column: 17
      range:
        start: 12
        end: 28

- description: multiple requests with bodies
  statement: |
    GET _search
    {
      "query": {
        "match_all": {}
      }
    }

    GET _search
    {
      "query": {
        "match_all": {}
      }
    }
  expectedCount: 2
  statements:
    - start:
        line: 1
        column: 1
    - start:
        line: 8
        column: 1

- description: request whose body fails to parse, then another request
  statement: "GET /_search\n{\"a\": x}\nGET /x\n"
  expectedCount: 2
  statements:
    - text: "GET /_search\n{\"a\": x}"
      start:
        line: 1
        column: 1
      end:
        line: 2
        column: 9
      range:
        start: 0
        end: 21
    - text: "GET /x"
      start:
        line: 3
        column: 1
      end:
        line: 3
        column: 7
      range:
        start: 22
        end: 28

- description: request whose body fails over several lines, blank lines before the next request
  statement: "GET /_search\n{\"a\": 1,\n  \"b\": x\n}  \r\n\n\nGET /x\n"
  expectedCount: 2
  statements:
    - text: "GET /_search\n{\"a\": 1,\n  \"b\": x\n}"
      start:
        line: 1
        column: 1
      end:
        line: 4
        column: 2
      range:
        start: 0
        end: 32
    - text: "GET /x"
      start:
        line: 7
        column: 1
      end:
        line: 7
        column: 7
      range:
        start: 38
        end: 44

- description: body truncated at the end of input
  statement: "GET /_search\n{\"a\": "
  expectedCount: 1
  statements:
    - text: "GET /_search\n{\"a\":"
      start:
        line: 1
        column: 1
      end:
        line: 2
        column: 6
      range:
        start: 0
        end: 18

- description: unclosed body at the end of input
  statement: "PUT /idx\n{\n"
  expectedCount: 1
  statements:
    - text: "PUT /idx\n{"
      start:
        line: 1
        column: 1
      end:
        line: 2
        column: 2
      range:
        start: 0
        end: 10

- description: body of the last request fails to parse
  statement: "GET /_search\n{\"a\": x}\n"
  expectedCount: 1
  statements:
    - text: "GET /_search\n{\"a\": x}"
      start:
        line: 1
        column: 1
      end:
        line: 2
        column: 9
      range:
        start: 0
        end: 21

- description: body of the last request fails to parse, after a request that parses
  statement: "GET _search\n{}\n\nGET /_search\n{\"a\": x}\n"
  expectedCount: 2
  statements:
    - text: "GET _search\n{}"
      start:
        line: 1
        column: 1
      end:
        line: 2
        column: 3
      range:
        start: 0
        end: 14
    - text: "GET /_search\n{\"a\": x}"
      start:
        line: 4
        column: 1
      end:
        line: 5
        column: 9
      range:
        start: 16
        end: 37

- description: request line that is not a request, last in the script
  statement: "GET /x\n{}\n}\n"
  expectedCount: 1
  statements:
    - text: "GET /x\n{}"
      start:
        line: 1
        column: 1
      end:
        line: 2
        column: 3
      range:
        start: 0
        end: 9
