syntax = "proto3";

// Bytebase persists DatabaseSchemaMetadata as protojson and reads it back with
// DiscardUnknown, so renaming a field or enum value silently drops that value
// from every stored snapshot. Field names, field numbers, and enum value names
// are frozen; the WIRE_JSON breaking rules in buf.yaml catch changes to them.
package omni.metadata;

option go_package = "github.com/bytebase/omni/metadata";

// DatabaseSchemaMetadata is the schema metadata for databases.
message DatabaseSchemaMetadata {
  string name = 1;

  // The list of schemas in a database.
  repeated SchemaMetadata schemas = 2;

  // The character set of the database.
  string character_set = 3;

  // The collation of the database.
  string collation = 4;

  // The list of extensions in a database.
  repeated ExtensionMetadata extensions = 5;

  // The database belongs to a datashare.
  bool datashare = 6;

  // The service name of the database. It's an Oracle-specific concept.
  string service_name = 7;

  repeated LinkedDatabaseMetadata linked_databases = 8;

  string owner = 9;

  // The search_path is the search path of a PostgreSQL database.
  string search_path = 10;

  // The list of event triggers in a database (PostgreSQL specific).
  // Event triggers are database-level objects, not schema-scoped.
  repeated EventTriggerMetadata event_triggers = 11;

  // The public synonyms of the database's instance (Oracle): the synonyms
  // owned by PUBLIC, to which an unqualified name resolves when the current
  // schema holds no object of that name. Every database of an instance holds
  // the same list, as with linked_databases.
  repeated SynonymMetadata public_synonyms = 12;

  // The default schema of the user that syncs the database (SQL Server's
  // SCHEMA_NAME()): where an unqualified name is created, and where it is
  // looked up before dbo. A sysadmin's is dbo.
  string default_schema = 13;

  // The foreign servers of a database (PostgreSQL CREATE SERVER). A foreign
  // table names one through ExternalTableMetadata.external_server_name, so a
  // dump writes the server before the table. An engine that holds no foreign
  // server leaves it empty.
  repeated ForeignServerMetadata foreign_servers = 14;

  // The foreign data wrappers the database declares itself (PostgreSQL CREATE
  // FOREIGN DATA WRAPPER). A wrapper an extension provides is not in the list:
  // the extension creates it. An engine that holds no foreign data wrapper
  // leaves it empty.
  repeated ForeignDataWrapperMetadata foreign_data_wrappers = 15;

  // TiDB database-level PLACEMENT POLICY name (empty when unset).
  string placement_policy = 16;

  // TiDB database-level TIFLASH REPLICA count (0 when unset).
  int32 tiflash_replica = 17;

  // TiDB database-level TIFLASH LOCATION LABELS list.
  repeated string tiflash_location_labels = 18;
}

// ForeignDataWrapperMetadata is a foreign data wrapper the database declares
// itself: what a foreign server names as the code that reaches its data.
message ForeignDataWrapperMetadata {
  // The name of the foreign data wrapper.
  string name = 1;

  // The handler function the wrapper states, as PostgreSQL's
  // pg_foreign_data_wrapper.fdwhandler names it. Empty when it declares none.
  string handler = 2;

  // The validator function the wrapper states, as PostgreSQL's
  // pg_foreign_data_wrapper.fdwvalidator names it. Empty when it declares none.
  string validator = 3;

  // The wrapper's options as pg_foreign_data_wrapper.fdwoptions states them:
  // each entry is "key=value", with the value unquoted. Empty when it declares
  // none.
  repeated string options = 4;
}

// ForeignServerMetadata is a foreign server (PostgreSQL CREATE SERVER): the
// connection a foreign table that names it reaches its data through.
message ForeignServerMetadata {
  // The name of the server.
  string name = 1;

  // The foreign data wrapper the server uses, such as "postgres_fdw".
  string fdw = 2;

  // The server's options as PostgreSQL's pg_foreign_server.srvoptions states
  // them: each entry is "key=value", with the value unquoted. Empty when the
  // server declares none.
  repeated string options = 3;

  // The server's TYPE clause. Unset when the server declares none; set to ""
  // when it declares an empty type, which pg_foreign_server.srvtype keeps
  // apart from NULL.
  optional string type = 4;

  // The server's VERSION clause. Unset when the server declares none; set to
  // "" when it declares an empty version, which pg_foreign_server.srvversion
  // keeps apart from NULL.
  optional string version = 5;
}

message LinkedDatabaseMetadata {
  string name = 1;

  string username = 2;

  string host = 3;
}

// SchemaMetadata is the metadata for schemas.
// This is the concept of schema in Postgres, but it's a no-op for MySQL.
message SchemaMetadata {
  // The schema name.
  // It is an empty string for databases without such concept such as MySQL.
  string name = 1;

  // The list of tables in a schema.
  repeated TableMetadata tables = 2;

  // The list of external tables in a schema.
  repeated ExternalTableMetadata external_tables = 3;

  // The list of views in a schema.
  repeated ViewMetadata views = 4;

  // The list of functions in a schema.
  repeated FunctionMetadata functions = 5;

  // The list of procedures in a schema.
  repeated ProcedureMetadata procedures = 6;

  // The list of streams in a schema, currently only used for Snowflake.
  repeated StreamMetadata streams = 7;

  // The list of tasks in a schema, currently only used for Snowflake.
  repeated TaskMetadata tasks = 8;

  // The list of materialized views in a schema.
  repeated MaterializedViewMetadata materialized_views = 9;

  // The list of sequences in a schema.
  repeated SequenceMetadata sequences = 10;

  // The list of packages in a schema.
  repeated PackageMetadata packages = 11;

  string owner = 12;

  string comment = 13;

  repeated EventMetadata events = 14;

  repeated EnumTypeMetadata enum_types = 15;

  bool skip_dump = 16;

  // The list of user-defined composite types in a schema (PostgreSQL family,
  // CREATE TYPE ... AS). Excludes table/view row types and derived types.
  repeated CompositeTypeMetadata composite_types = 17;

  // The list of synonyms in a schema: Oracle's private synonyms, whose
  // public ones are in DatabaseSchemaMetadata.public_synonyms, and SQL
  // Server's synonyms.
  repeated SynonymMetadata synonyms = 18;

  // The list of user-defined collations in a schema (PostgreSQL CREATE
  // COLLATION). The collations the server ships in pg_catalog and
  // information_schema are not in the list: a column that uses one names it
  // and the server already has it.
  repeated CollationMetadata collations = 19;

  // The list of user-defined range types in a schema (PostgreSQL CREATE TYPE
  // ... AS RANGE). A server creates the type's constructor functions and, from
  // PostgreSQL 14, its multirange type itself, so neither is in the lists here.
  repeated RangeTypeMetadata range_types = 20;
}

// RangeTypeMetadata is a range type over a subtype (PostgreSQL CREATE TYPE
// ... AS RANGE): every value it holds is a range of the subtype.
message RangeTypeMetadata {
  // The name of the range type.
  string name = 1;

  // The subtype the range covers, as the server states it: an emit-ready type
  // name, schema-qualified when it is not a pg_catalog type. For example
  // "double precision" or "app.measure".
  string subtype = 2;

  // The operator class the range's subtype uses, schema-qualified, when it is
  // not the subtype's default.
  string subtype_opclass = 3;

  // The collation the subtype is compared with, as an emit-ready identifier
  // reference (quoted as needed, schema-qualified), when it is not the
  // subtype's own.
  string collation = 4;

  // The function that turns a range into its canonical form, when the range
  // declares one. PostgreSQL creates such a range from a shell type, the
  // function, then the full type, and the function's definition is a C symbol,
  // so a dump that writes the type alone cannot restore it; the field is here
  // so the loss shows in a restored snapshot instead of hiding.
  string canonical = 5;

  // The function that subtracts two subtype values to size a range's gap, when
  // the range declares one. It carries canonical's constraint.
  string subtype_diff = 6;

  // The multirange type the server made beside the range type, as an
  // emit-ready type name. Empty before PostgreSQL 14, which has no multirange
  // types.
  string multirange_name = 7;

  // The comment COMMENT ON TYPE states, if any.
  string comment = 8;

  // The range type belongs to an extension, so creating the extension creates
  // it and the dump leaves it out.
  bool skip_dump = 9;
}

// CollationMetadata is a collation an object of the schema refers to by name
// (PostgreSQL CREATE COLLATION). Without it the reference names nothing the
// dump creates, so an object that sorts or compares with it cannot restore.
message CollationMetadata {
  // The name of the collation.
  string name = 1;

  // The provider that resolves the locale, as PostgreSQL's collprovider
  // states it: "c" libc, "i" ICU, "b" builtin, or "d" the database default.
  // Empty when the engine states no provider.
  string provider = 2;

  // The locale an ICU or builtin provider resolves, as the server states it
  // (for example "und-u-ks-level2").
  string locale = 3;

  // The LC_COLLATE a libc provider sorts with.
  string lc_collate = 4;

  // The LC_CTYPE a libc provider classifies with.
  string lc_ctype = 5;

  // Whether the collation tells two different strings apart. Unset means the
  // engine does not state it; PostgreSQL states it only as
  // deterministic = false, which lets a collation compare 'a' and 'A' equal.
  optional bool deterministic = 6;

  // The comment COMMENT ON COLLATION states, if any.
  string comment = 7;

  // The collation belongs to an extension, so creating the extension creates
  // it and the dump leaves it out.
  bool skip_dump = 8;

  // The ICU rules the collation tailors its locale with (CREATE COLLATION ...
  // rules = '...'). PostgreSQL keeps them in collicurules from 16; a release
  // before that cannot state rules, and a collation that declares none leaves
  // the field empty.
  string rules = 9;
}

// SynonymMetadata is a synonym: another name for an object, which the engine
// resolves only when the synonym is used. A synced list may lack a synonym
// whose object is gone or not accessible to the syncing user (Oracle's
// ALL_SYNONYMS omits it), so a name absent from the list can still be taken
// by a synonym.
message SynonymMetadata {
  // The name of the synonym.
  string name = 1;

  // The schema of the object the synonym stands for.
  string target_schema = 2;

  // The name of the object the synonym stands for.
  string target_name = 3;

  // The database link through which the object is reached (Oracle), if any.
  string target_db_link = 4;

  // The database the object is in (SQL Server), if the synonym names one.
  string target_database = 5;

  // The linked server the object is on (SQL Server), if the synonym names
  // one.
  string target_server = 6;
}

message EnumTypeMetadata {
  // The name of the enum type.
  string name = 1;

  // The enum values of the type.
  repeated string values = 2;

  string comment = 3;

  bool skip_dump = 4;
}

message CompositeTypeMetadata {
  // The name of the composite type.
  string name = 1;

  // The ordered attributes of the composite type.
  repeated CompositeTypeAttribute attributes = 2;

  string comment = 3;

  bool skip_dump = 4;
}

message CompositeTypeAttribute {
  // The name of the attribute.
  string name = 1;

  // The attribute type. User-defined types are always schema-qualified.
  string type = 2;

  // The non-default collation of the attribute as an emit-ready SQL
  // identifier reference (quoted as needed, schema-qualified when outside
  // pg_catalog), empty otherwise. e.g. `"C"` or `locale.en_us`.
  string collation = 3;

  string comment = 4;
}

message EventMetadata {
  // The name of the event.
  string name = 1;

  // The schedule of the event.
  string definition = 2;

  // The time zone of the event.
  string time_zone = 3;

  string sql_mode = 4;

  string character_set_client = 5;

  string collation_connection = 6;

  string comment = 7;
}

message SequenceMetadata {
  // The name of a sequence.
  string name = 1;

  // The data type of a sequence.
  string data_type = 2;

  // The start value of a sequence.
  string start = 3;

  // The minimum value of a sequence.
  string min_value = 4;

  // The maximum value of a sequence.
  string max_value = 5;

  // The increment value of a sequence.
  string increment = 6;

  // Whether the sequence cycles.
  bool cycle = 7;

  // Cache size of a sequence.
  string cache_size = 8;

  // The last value of a sequence.
  string last_value = 9;

  // The table that owns the sequence.
  string owner_table = 10;

  // The column that owns the sequence.
  string owner_column = 11;

  string comment = 12;

  bool skip_dump = 13;

  // Whether the sequence orders its values instead of letting them be
  // allocated out of order (Oracle ORDER).
  bool order = 14;

  // Whether the sequence keeps its values across a restart (Oracle KEEP).
  bool keep = 15;

  // Whether the sequence scales its values by the session and shard it is
  // allocated in (Oracle SCALE).
  bool scale = 16;

  // Whether a scaled sequence extends its values past MAXVALUE rather than
  // cycling (Oracle SCALE EXTEND).
  bool extend = 17;

  // Whether the sequence belongs to a session rather than to the schema
  // (Oracle SESSION).
  bool session = 18;

  // Whether the sequence is sharded (Oracle SHARD).
  bool sharded = 19;
}

message TriggerMetadata {
  reserved 2;
  // The name of the trigger.
  string name = 1;

  // The event that triggers this action, such as INSERT, UPDATE, DELETE, or TRUNCATE.
  string event = 3;

  // The timing of when the trigger fires, such as BEFORE or AFTER.
  string timing = 4;

  // The body of the trigger.
  string body = 5;

  string sql_mode = 6;

  string character_set_client = 7;

  string collation_connection = 8;

  string comment = 9;

  bool skip_dump = 10;
}

// RuleMetadata is the metadata for PostgreSQL rules.
message RuleMetadata {
  // The name of the rule.
  string name = 1;

  // The event type of the rule: SELECT, INSERT, UPDATE, or DELETE.
  string event = 2;

  // The WHERE condition of the rule (optional).
  string condition = 3;

  // The command(s) to execute when the rule fires.
  string action = 4;

  // The is_instead indicates whether this is an INSTEAD rule.
  bool is_instead = 5;

  // The is_enabled indicates whether the rule is enabled.
  bool is_enabled = 6;

  // The full CREATE RULE statement.
  string definition = 7;
}

message TaskMetadata {
  // The name of the task.
  string name = 1;

  // The Snowflake-generated ID of the task.
  // Example: 01ad32a0-1bb6-5e93-0000-000000000001.
  string id = 2;

  // The owner of the task.
  string owner = 3;

  // The comment of the task.
  string comment = 4;

  // The warehouse of the task.
  string warehouse = 5;

  // The schedule interval of the task.
  string schedule = 6;

  // The predecessor tasks of the task.
  repeated string predecessors = 7;

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_STARTED = 1;
    STATE_SUSPENDED = 2;
  }
  // The state of the task.
  State state = 8;

  // The condition of the task.
  string condition = 9;

  // The definition of the task.
  string definition = 10;
}

message StreamMetadata {
  // The name of the stream.
  string name = 1;

  // The table_name is the name of the table/view that the stream is created on.
  string table_name = 2;

  // The owner of the stream.
  string owner = 3;

  // The comment of the stream.
  string comment = 4;

  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_DELTA = 1;
  }
  // The type of the stream.
  Type type = 5;

  // Indicates whether the stream was last read before the `stale_after` time.
  bool stale = 6;

  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_DEFAULT = 1;
    MODE_APPEND_ONLY = 2;
    MODE_INSERT_ONLY = 3;
  }
  // The mode of the stream.
  Mode mode = 7;

  // The definition of the stream.
  string definition = 8;
}

// TableMetadata is the metadata for tables.
message TableMetadata {
  reserved 13 to 14;
  // The name of the table.
  string name = 1;

  // The columns is the ordered list of columns in a table.
  repeated ColumnMetadata columns = 2;

  // The indexes is the list of indexes in a table.
  repeated IndexMetadata indexes = 3;

  // TODO(d): figure out whether we need to store table type such as "BASE
  // TABLE".

  // The engine is the engine of a table.
  string engine = 4;

  // The collation is the collation of a table.
  string collation = 5;

  // The character set of the table.
  string charset = 17;

  // The row_count is the estimated number of rows of a table.
  int64 row_count = 6;

  // The data_size is the estimated data size of a table.
  int64 data_size = 7;

  // The index_size is the estimated index size of a table.
  int64 index_size = 8;

  // The data_free is the estimated free data size of a table.
  int64 data_free = 9;

  // The create_options is the create option of a table.
  string create_options = 10;

  // The comment is the comment of a table.
  string comment = 11;

  // The foreign_keys is the list of foreign keys in a table.
  repeated ForeignKeyMetadata foreign_keys = 12;

  // The partitions is the list of partitions in a table.
  repeated TablePartitionMetadata partitions = 15;

  // The check_constraints is the list of check constraints in a table.
  repeated CheckConstraintMetadata check_constraints = 16;

  string owner = 18;

  // The sorting_keys is a tuple of column names or arbitrary expressions. ClickHouse specific field.
  // Reference: https://clickhouse.com/docs/en/engines/table-engines/mergetree-family/mergetree#order_by
  repeated string sorting_keys = 19;

  repeated TriggerMetadata triggers = 20;

  bool skip_dump = 21;

  // The rules is the list of rules in a table (PostgreSQL specific).
  repeated RuleMetadata rules = 24;

  // https://docs.pingcap.com/tidb/stable/information-schema-tables/
  string sharding_info = 22;

  // https://docs.pingcap.com/tidb/stable/clustered-indexes/#clustered-indexes
  // CLUSTERED or NONCLUSTERED.
  string primary_key_type = 23;

  // The exclude_constraints is the list of EXCLUDE constraints in a table (PostgreSQL specific).
  repeated ExcludeConstraintMetadata exclude_constraints = 25;

  // OceanBase WITH COLUMN GROUP (...) specification (e.g. "all columns, each column").
  string column_groups = 26;

  // TiDB CREATE GLOBAL TEMPORARY TABLE flag and ON COMMIT clause.
  bool is_global_temporary = 27;
  string on_commit = 28;

  // TiDB placement policy name (PLACEMENT POLICY = ...).
  string placement_policy = 29;

  // TiDB TTL settings (TTL, TTL_ENABLE, TTL_JOB_INTERVAL).
  string ttl_column = 30;
  string ttl_interval = 31;
  bool ttl_enable = 32;
  string ttl_job_interval = 33;

  // TiDB allocation and TiFlash settings.
  int64 auto_id_cache = 34;
  int32 pre_split_regions = 35;
  int32 tiflash_replica = 36;
  repeated string tiflash_location_labels = 37;

  // MySQL / OceanBase table tablespace name.
  string tablespace = 38;
}

message CheckConstraintMetadata {
  // The name of the check constraint.
  string name = 1;

  // The expression is the expression of a check constraint.
  string expression = 2;

  // The comment is the comment of a check constraint as the engine states it, not
  // as a first-class attribute of the constraint: SQL Server's MS_Description
  // extended property, PostgreSQL's COMMENT ON CONSTRAINT. An engine that holds
  // no constraint comment (MySQL and its forks, Oracle) leaves it empty.
  string comment = 3;

  // Whether the check constraint is NOT ENFORCED (MySQL 8.0.16+, OceanBase, TiDB).
  bool not_enforced = 4;
}

message ExcludeConstraintMetadata {
  // The name of the EXCLUDE constraint.
  string name = 1;

  // The expression is the full EXCLUDE constraint definition including "EXCLUDE" keyword.
  // Example: "EXCLUDE USING gist (room_id WITH =, during WITH &&)"
  string expression = 2;
}

message ExternalTableMetadata {
  // The name of the external table.
  string name = 1;

  // The external_server_name is the name of the external server.
  string external_server_name = 2;

  // The external_database_name is the name of the external database.
  string external_database_name = 3;

  // The columns is the ordered list of columns in a foreign table.
  repeated ColumnMetadata columns = 4;

  // The table's options as PostgreSQL's pg_foreign_table.ftoptions states
  // them: each entry is "key=value", with the value unquoted. Empty when the
  // table declares none.
  repeated string options = 5;

  // The location the engine states for an external table (OceanBase's
  // LOCATION, which SHOW CREATE TABLE states). Empty when the engine states
  // no location.
  string location = 6;

  // The FORMAT clause the engine states for an external table (OceanBase),
  // without the FORMAT keyword and its enclosing parentheses: for example
  // "TYPE = 'CSV', ENCODING = 'utf8mb4'". Empty when the engine states no
  // format.
  string format = 7;

  // The table belongs to an extension, which creates it; a dump leaves it
  // alone. A foreign table a user creates inside an extension-owned schema is
  // not skipped: the extension owns the schema, not every object made in it.
  bool skip_dump = 8;

  // The check constraints the engine states on a foreign table. PostgreSQL does
  // not enforce them locally but uses them for query optimization, so a dump
  // writes them. Empty for an engine that states none.
  repeated CheckConstraintMetadata check_constraints = 9;

  // The file filter the engine states for an external table (OceanBase's
  // PATTERN), such as ".*[.]csv". Empty when the engine states none; omitting
  // it makes the table read every file under its location.
  string pattern = 10;

  // The triggers the engine states on a foreign table. Empty for an engine that
  // states none.
  repeated TriggerMetadata triggers = 11;

  // The automatic refresh policy an external table states (OceanBase's
  // AUTO_REFRESH), such as "OFF", "IMMEDIATE" or an interval. Empty when the
  // engine states none.
  string auto_refresh = 12;
}

// TablePartitionMetadata is the metadata for table partitions.
message TablePartitionMetadata {
  // The name of the table partition.
  string name = 1;

  // The type is the type of a table partition. Some database engines may not
  // support all types. Only available for the following database engines now:
  // MySQL: RANGE, RANGE COLUMNS, LIST, LIST COLUMNS, HASH, LINEAR HASH, KEY,
  // LINEAR_KEY
  // (https://dev.mysql.com/doc/refman/8.0/en/partitioning-types.html) TiDB:
  // RANGE, RANGE COLUMNS, LIST, LIST COLUMNS, HASH, KEY PostgreSQL: RANGE,
  // LIST, HASH (https://www.postgresql.org/docs/current/ddl-partitioning.html)
  enum Type {
    TYPE_UNSPECIFIED = 0;
    RANGE = 1;
    RANGE_COLUMNS = 2;
    LIST = 3;
    LIST_COLUMNS = 4;
    HASH = 5;
    LINEAR_HASH = 6;
    KEY = 7;
    LINEAR_KEY = 8;
  }

  // The type of a table partition.
  Type type = 2;

  // The expression is the expression of a table partition.
  // For PostgreSQL, the expression is the text of {FOR VALUES
  // partition_bound_spec}, see
  // https://www.postgresql.org/docs/current/sql-createtable.html. For MySQL,
  // the expression is the `expr` or `column_list` of the following syntax.
  // PARTITION BY
  //    { [LINEAR] HASH(expr)
  //    | [LINEAR] KEY [ALGORITHM={1 | 2}] (column_list)
  //    | RANGE{(expr) | COLUMNS(column_list)}
  //    | LIST{(expr) | COLUMNS(column_list)} }.
  string expression = 3;

  // The value is the value of a table partition.
  // For MySQL, the value is for RANGE and LIST partition types,
  // - For a RANGE partition, it contains the value set in the partition's
  // VALUES LESS THAN clause, which can be either an integer or MAXVALUE.
  // - For a LIST partition, this column contains the values defined in the
  // partition's VALUES IN clause, which is a list of comma-separated integer
  // values.
  // - For others, it's an empty string.
  string value = 4;

  // The use_default is whether the users use the default partition, it stores
  // the different value for different database engines. For MySQL, it's [INT]
  // type, 0 means not use default partition, otherwise, it's equals to number
  // in syntax [SUB]PARTITION {number}.
  string use_default = 5;

  // The subpartitions is the list of subpartitions in a table partition.
  repeated TablePartitionMetadata subpartitions = 6;

  repeated IndexMetadata indexes = 7;

  repeated CheckConstraintMetadata check_constraints = 8;

  repeated ExcludeConstraintMetadata exclude_constraints = 9;

  // The schema is the schema the partition lives in. A partition can live in
  // a schema other than its parent's; an engine that keeps every partition in
  // its table's schema leaves it empty.
  string schema = 10;

  // The comment is the comment the engine states on the partition itself:
  // PostgreSQL's COMMENT ON TABLE for a partition, MySQL's PARTITION ...
  // COMMENT. An engine that states no partition comment leaves it empty.
  string comment = 11;

  // OceanBase RANGE split size from SIZE ('...'), e.g. "2048MB" or "1G".
  string split_size = 12;

  // OceanBase automatic partition size from PARTITION SIZE <val> PARTITIONS AUTO.
  string auto_size = 13;

  // KEY / LINEAR KEY partitioning algorithm (1 or 2; 0 when omitted/default).
  int32 algorithm = 14;

  // Unexpanded TiDB RANGE INTERVAL (...) FIRST ... LAST ... clause.
  string interval_clause = 15;

  // OceanBase SUBPARTITION TEMPLATE definitions. Present on the first partition entry
  // when the table retains an explicit subpartition template.
  repeated TablePartitionMetadata subpartition_template = 16;
}

// ColumnMetadata is the metadata for columns.
message ColumnMetadata {
  reserved 4 to 5, 11 to 12;
  // The name of the column.
  string name = 1;

  // The position is the position in columns.
  int32 position = 2;

  // The default value of the column.
  string default = 3;

  // Oracle specific metadata.
  // The default_on_null is the default on null of a column.
  bool default_on_null = 16;

  // The on_update is the on update action of a column.
  // For MySQL like databases, it's only supported for TIMESTAMP columns with
  // CURRENT_TIMESTAMP as on update value.
  string on_update = 13;

  // The nullable is the nullable of a column.
  bool nullable = 6;

  // The type is the type of a column.
  string type = 7;

  // The character_set is the character_set of a column.
  string character_set = 8;

  // The collation is the collation of a column.
  string collation = 9;

  // The comment is the comment of a column.
  string comment = 10;

  // The generation is for generated columns.
  GenerationMetadata generation = 14;

  bool is_identity = 17;

  enum IdentityGeneration {
    IDENTITY_GENERATION_UNSPECIFIED = 0;
    ALWAYS = 1;
    BY_DEFAULT = 2;
  }

  // The identity_generation is for identity columns, PG only.
  IdentityGeneration identity_generation = 15;

  // The identity_seed is for identity columns, MSSQL only.
  int64 identity_seed = 18;

  // The identity_increment is for identity columns, MSSQL only.
  int64 identity_increment = 19;

  // The options the engine states on a foreign table's column, as PostgreSQL's
  // pg_attribute.attfdwoptions does: each entry is "key=value", with the value
  // unquoted. Empty for a column that declares none, and for an engine that
  // states no column options.
  repeated string options = 24;

  // The default_constraint_name is the name of the default constraint, MSSQL only.
  // In MSSQL, default values are implemented as named constraints. When modifying or
  // dropping a column's default value, you must reference the constraint by name.
  // This field stores the actual constraint name from the database.
  //
  // Example: A column definition like:
  //   CREATE TABLE employees (
  //     status NVARCHAR(20) DEFAULT 'active'
  //   )
  //
  // Will create a constraint with an auto-generated name like 'DF__employees__statu__3B75D760'
  // or a user-defined name if specified:
  //   ALTER TABLE employees ADD CONSTRAINT DF_employees_status DEFAULT 'active' FOR status
  //
  // To modify the default, you must first drop the existing constraint by name:
  //   ALTER TABLE employees DROP CONSTRAINT DF__employees__statu__3B75D760
  //   ALTER TABLE employees ADD CONSTRAINT DF_employees_status DEFAULT 'inactive' FOR status
  //
  // This field is populated when syncing from the database. When empty (e.g., when parsing
  // from SQL files), the system cannot automatically drop the constraint.
  string default_constraint_name = 20;

  // The spatial reference system identifier of a spatial column, MySQL 8.0 only.
  // Unset means the column declares no SRID; presence carries the explicit SRID,
  // including the valid SRID 0. SRS_IDs are unsigned 32-bit (custom SRSs may exceed
  // int32). Captured from information_schema.COLUMNS.SRS_ID and rendered as the
  // `/*!80003 SRID n */` column attribute.
  optional uint32 srid = 21;

  // Whether the column is invisible (hidden from SELECT *), MySQL 8.0.23+ only.
  // Captured from information_schema.COLUMNS.EXTRA containing INVISIBLE and
  // rendered as the `/*!80023 INVISIBLE */` column attribute.
  bool is_invisible = 22;

  // The schema of the user-defined collation the column names, without quoting
  // (PostgreSQL). Empty for a collation the server ships in pg_catalog, which
  // an unqualified name reaches, and for an engine without schemas. A dump
  // restores with an empty search_path, so a collation outside pg_catalog needs
  // this written beside the name.
  string collation_schema = 23;

  // Whether an explicit ALTER COLUMN DROP DEFAULT removed the default on a
  // nullable column (MySQL, OceanBase, TiDB).
  bool default_dropped = 25;

  // MySQL-generated invisible primary key column (my_row_id).
  bool is_generated_invisible_primary_key = 26;

  // MySQL NOT SECONDARY column attribute.
  bool not_secondary = 27;

  // True when a string column's character_set or collation was inherited from
  // its table rather than explicitly declared (MySQL / OceanBase). Unset on
  // explicit declarations and legacy live syncs.
  bool charset_inherited = 28;
  bool collation_inherited = 29;
}

message GenerationMetadata {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_VIRTUAL = 1;
    TYPE_STORED = 2;
  }

  Type type = 1;
  string expression = 2;
}

// ViewMetadata is the metadata for views.
message ViewMetadata {
  // The name of the view.
  string name = 1;

  // The definition is the definition of a view.
  string definition = 2;

  // The comment is the comment of a view.
  string comment = 3;

  // The list of dependency columns of a view.
  repeated DependencyColumn dependency_columns = 4;

  // The ordered list of columns in the view.
  repeated ColumnMetadata columns = 5;

  // The list of triggers in the view.
  repeated TriggerMetadata triggers = 6;

  bool skip_dump = 7;

  // The rules is the list of rules in a view (PostgreSQL specific).
  repeated RuleMetadata rules = 8;

  // View execution algorithm (UNDEFINED, MERGE, TEMPTABLE) and SQL security (DEFINER, INVOKER).
  string algorithm = 9;
  string sql_security = 10;

  // View check option clause ("LOCAL", "CASCADED", or empty).
  string check_option = 11;
}

// DependencyColumn is the metadata for dependency columns.
message DependencyColumn {
  // The schema is the schema of a reference column.
  string schema = 1;

  // The table is the table of a reference column.
  string table = 2;

  // The column is the name of a reference column.
  string column = 3;
}

// MaterializedViewMetadata is the metadata for materialized views.
message MaterializedViewMetadata {
  // The name of the materialized view.
  string name = 1;

  // The definition is the definition of a view.
  string definition = 2;

  // The comment is the comment of a view.
  string comment = 3;

  // The list of dependency columns of the view.
  repeated DependencyColumn dependency_columns = 4;

  // The ordered list of columns in the materialized view.
  repeated TriggerMetadata triggers = 5;

  // The list of indexes in the materialized view.
  repeated IndexMetadata indexes = 6;

  bool skip_dump = 7;
}

message DependencyTable {
  // The schema is the schema of a reference table.
  string schema = 1;

  // The table is the name of a reference table.
  string table = 2;
}

// FunctionMetadata is the metadata for functions.
message FunctionMetadata {
  // The name of the function.
  string name = 1;

  // The definition is the definition of a function.
  string definition = 2;

  // The signature is the name with the number and type of input arguments the
  // function takes.
  string signature = 3;

  // MySQL specific metadata.
  string character_set_client = 4;

  string collation_connection = 5;

  string database_collation = 6;

  string sql_mode = 7;

  string comment = 8;

  // The dependency_tables is the list of dependency tables of a function.
  // For PostgreSQL, it's the list of tables that the function depends on the return type definition.
  repeated DependencyTable dependency_tables = 9;

  bool skip_dump = 10;
}

// ProcedureMetadata is the metadata for procedures.
message ProcedureMetadata {
  // The name of the procedure.
  string name = 1;

  // The definition is the definition of a procedure.
  string definition = 2;

  // The signature is the name with the number and type of input arguments the
  // function takes.
  string signature = 3;

  // MySQL specific metadata.
  string character_set_client = 4;

  string collation_connection = 5;

  string database_collation = 6;

  string sql_mode = 7;

  string comment = 9;

  bool skip_dump = 8;
}

// PackageMetadata is the metadata for packages.
message PackageMetadata {
  // The name of the package.
  string name = 1;

  // The definition is the definition of a package.
  string definition = 2;
}

// IndexMetadata is the metadata for indexes.
message IndexMetadata {
  // The name of the index.
  string name = 1;

  // The expressions are the ordered columns or expressions of an index.
  //
  // For PostgreSQL, the canonical shape for each entry matches
  // pg_get_indexdef(oid, col, true) — the tightest `index_elem` grammar form:
  //   - column key:        bare identifier            e.g. "id", `"Name"`
  //   - function-call key: bare func_expr_windowless  e.g. "lower(name)"
  //   - expression key:    parenthesized a_expr       e.g. "(payload ->> 'k'::text)"
  // The DDL emitter writes entries verbatim into the CREATE INDEX key list.
  repeated string expressions = 2;

  // The ordered list of key lengths for the index.
  // If the key length is not specified, it is -1.
  repeated int64 key_length = 9;

  // The ordered list of descending flags for the index columns.
  repeated bool descending = 10;

  // The type is the type of an index.
  string type = 3;

  // The unique is whether the index is unique.
  bool unique = 4;

  // The primary is whether the index is a primary key index.
  bool primary = 5;

  // The visible is whether the index is visible.
  bool visible = 6;

  // The comment is the comment of an index.
  string comment = 7;

  // The definition of an index.
  string definition = 8;

  // The schema name of the parent index.
  string parent_index_schema = 11;

  // The index name of the parent index.
  string parent_index_name = 12;

  // The number of granules in the block. It's a ClickHouse specific field.
  int64 granularity = 13;

  // Whether the index backs a constraint, so DDL must not create it on its
  // own: PostgreSQL and Oracle keep the constraint and its index as two
  // objects, and a unique index that backs no constraint is not a unique
  // constraint.
  bool is_constraint = 14;

  // The constraints the index enforces, if any. PostgreSQL and Oracle each
  // reuse an existing index for a constraint, so a constraint and its index are
  // two differently named objects, and Oracle shares one index between several
  // constraints, so a primary key and a unique constraint may draw on one. The
  // index's expressions are the index's own keys; a constraint's are its own,
  // which Oracle may take a subset of the index's.
  //
  // is_constraint and primary summarise this list for consumers that only need
  // whether the index is a constraint's and whether one of them is the primary
  // key.
  repeated IndexConstraintMetadata constraints = 18;

  // Spatial index specific configuration
  SpatialIndexConfig spatial_config = 15;

  // https://www.postgresql.org/docs/current/catalog-pg-opclass.html
  // Name of the operator class for each column. (PostgreSQL specific).
  repeated string opclass_names = 16;
  // True if the operator class is the default. (PostgreSQL specific).
  repeated bool opclass_defaults = 17;

  // TiDB vector index flag (VECTOR INDEX).
  bool is_vector = 19;

  // TiDB global partitioned index flag (/*T![global_index] GLOBAL */).
  bool is_global = 20;

  // OceanBase index scope ("GLOBAL", "LOCAL", or empty).
  string scope = 21;

  // OceanBase STORING (...) columns carried by an index.
  repeated string storing_columns = 22;

  // OceanBase VECTOR INDEX ... WITH (...) parameter entries ("KEY=VAL").
  repeated string vector_params = 23;

  // OceanBase full-text WITH PARSER name and PARSER_PROPERTIES.
  string parser = 24;
  map<string, string> parser_properties = 25;

  // Per-index KEY_BLOCK_SIZE option (0 when unset).
  int64 key_block_size = 26;
}

// IndexConstraintMetadata is a constraint an index enforces.
message IndexConstraintMetadata {
  // The name of the constraint.
  string name = 1;

  // The key columns or expressions of the constraint, in the order the
  // constraint declares them. They are the index's expressions only when the
  // constraint is on every key of the index.
  repeated string columns = 2;

  // Whether the constraint is the primary key.
  bool primary = 3;
}

// SpatialIndexConfig is the configuration for spatial indexes across different database engines.
message SpatialIndexConfig {
  // Index method/type (database-specific)
  // Examples: "SPATIAL" (MySQL/SQL Server), "GIST"/"SPGIST" (PostgreSQL), "MDSYS.SPATIAL_INDEX_V2" (Oracle)
  string method = 1;

  // Tessellation configuration (primarily SQL Server)
  TessellationConfig tessellation = 2;

  // Storage and performance parameters
  StorageConfig storage = 3;

  // Dimensional and constraint parameters
  DimensionalConfig dimensional = 4;

  // Database-specific parameters (stored as key-value pairs for extensibility)
  map<string, string> engine_specific = 5;
}

// TessellationConfig defines tessellation parameters for spatial indexes.
message TessellationConfig {
  // Tessellation scheme
  // Examples: GEOMETRY_GRID, GEOGRAPHY_GRID, GEOMETRY_AUTO_GRID, GEOGRAPHY_AUTO_GRID
  string scheme = 1;

  // Bounding box for GEOMETRY indexes (SQL Server)
  BoundingBox bounding_box = 2;

  // Grid level configuration (SQL Server)
  repeated GridLevel grid_levels = 3;

  // Cells per object (SQL Server)
  int32 cells_per_object = 4;
}

// BoundingBox defines the bounding box for spatial indexes.
message BoundingBox {
  double xmin = 1;
  double ymin = 2;
  double xmax = 3;
  double ymax = 4;
}

// GridLevel defines a grid level for spatial tessellation.
message GridLevel {
  int32 level = 1; // 1-4 for SQL Server
  string density = 2; // LOW, MEDIUM, HIGH
}

// StorageConfig defines storage and performance parameters for spatial indexes.
message StorageConfig {
  // PostgreSQL parameters
  int32 fillfactor = 1; // 10-100
  string buffering = 2; // auto, on, off

  // Oracle parameters
  string tablespace = 3;
  string work_tablespace = 4;
  int32 sdo_level = 5;
  int32 commit_interval = 6;

  // SQL Server parameters
  bool pad_index = 7;
  string sort_in_tempdb = 8; // ON, OFF
  bool drop_existing = 9;
  bool online = 10;
  bool allow_row_locks = 11;
  bool allow_page_locks = 12;
  int32 maxdop = 13;
  string data_compression = 14; // NONE, ROW, PAGE
}

// DimensionalConfig defines dimensional and constraint parameters for spatial indexes.
message DimensionalConfig {
  // Number of dimensions (2-4, default 2)
  int32 dimensions = 1;

  // Spatial data type
  // Examples: GEOMETRY, GEOGRAPHY, POINT, POLYGON, etc.
  string data_type = 2;

  // PostgreSQL operator class
  // Examples: gist_geometry_ops_2d, gist_geometry_ops_nd, etc.
  string operator_class = 3;

  // Oracle geometry type constraint
  // Examples: POINT, LINE, POLYGON, COLLECTION
  string layer_gtype = 4;

  // Parallel index creation
  bool parallel_build = 5;
}

// ExtensionMetadata is the metadata for extensions.
message ExtensionMetadata {
  // The name of the extension.
  string name = 1;

  // The schema where the extension is installed. However, the extension usage
  // is not limited to the schema.
  string schema = 2;

  // The version is the version of an extension.
  string version = 3;

  // The description is the description of an extension.
  string description = 4;
}

// EventTriggerMetadata is the metadata for PostgreSQL event triggers.
// Event triggers are database-level objects that fire on DDL events.
message EventTriggerMetadata {
  // The name of the event trigger.
  string name = 1;

  // The event type: DDL_COMMAND_START, DDL_COMMAND_END, SQL_DROP, TABLE_REWRITE.
  string event = 2;

  // The tags filter (e.g., ['CREATE TABLE', 'DROP TABLE']).
  repeated string tags = 3;

  // The schema of the function to execute.
  string function_schema = 4;

  // The name of the function to execute.
  string function_name = 5;

  // Whether the trigger is enabled.
  bool enabled = 6;

  // The full CREATE EVENT TRIGGER definition from pg_get_event_trigger_def().
  // SDL output should prefer using this field.
  string definition = 7;

  // The comment on the event trigger.
  string comment = 8;

  // Skip dump flag (for extension-owned triggers).
  bool skip_dump = 9;
}

// ForeignKeyMetadata is the metadata for foreign keys.
message ForeignKeyMetadata {
  // The name of the foreign key.
  string name = 1;

  // The columns are the ordered referencing columns of a foreign key.
  repeated string columns = 2;

  // The referenced_schema is the referenced schema name of a foreign key.
  // It is an empty string for databases without such concept such as MySQL.
  string referenced_schema = 3;

  // The referenced_table is the referenced table name of a foreign key.
  string referenced_table = 4;

  // The referenced_columns are the ordered referenced columns of a foreign key.
  repeated string referenced_columns = 5;

  // The on_delete is the on delete action of a foreign key.
  string on_delete = 6;

  // The on_update is the on update action of a foreign key.
  string on_update = 7;

  // The match_type is the match type of a foreign key.
  // The match_type is the PostgreSQL specific field.
  // It's empty string for other databases.
  string match_type = 8;

  // The comment is the comment of a foreign key as the engine states it, not as a
  // first-class attribute of the constraint: SQL Server's MS_Description extended
  // property, PostgreSQL's COMMENT ON CONSTRAINT. An engine that holds no
  // constraint comment (MySQL and its forks, Oracle) leaves it empty.
  string comment = 9;
}
