name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # One job on the org's self-hosted runners. It tests what the PR touches
    # (scripts/affected-packages.sh); every test runs here, and nothing is
    # skipped or nightly. Tests start the servers they need as testcontainers.
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      # Sweep sizes the old nightly used; they add ~20 s here, so every PR gets them.
      SPLITTEST_N: '1000000'
      WALK_SWEEP_N: '500'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # affected-packages.sh diffs against the base branch

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false # the runner keeps GOCACHE/GOMODCACHE between runs

      # Both steps regenerate committed code and fail if the result differs from
      # what the PR holds. `git add -A` so a generated file that is new counts too.
      - name: Walkers are in sync
        run: |
          go generate ./pg/ast/... ./redshift/ast/... ./mysql/ast/... ./mariadb/ast/... \
            ./tidb/ast/... ./oceanbase/ast/... ./mssql/ast/... ./oracle/ast/... \
            ./snowflake/ast/... ./googlesql/ast/...
          git add -A && git diff --cached --exit-code

      - name: Proto is formatted, lint-clean, generated and non-breaking
        working-directory: proto
        env:
          BUF: go run github.com/bufbuild/buf/cmd/buf@v1.72.0 # the only pin
        run: |
          $BUF format -w
          $BUF lint
          $BUF generate
          $BUF breaking --against 'https://github.com/bytebase/omni.git#branch=main,subdir=proto'
          git add -A && git diff --cached --exit-code

      - name: Build
        run: go build ./...

      # Fails an edited judge's answer, a regression committed as omni's
      # verdict, and a pin bump that also changes code (enginetest/compat.Guard).
      - name: Engine answers change only by recording
        run: go run ./enginetest/cmd/compatcheck origin/${{ github.base_ref }}

      - name: Affected packages
        id: affected
        run: |
          targets=$(scripts/affected-packages.sh origin/${{ github.base_ref }})
          echo "$targets"
          echo "pkgs=$(tr ' ' '\n' <<< "$targets" | grep '^\./' | xargs)" >> "$GITHUB_OUTPUT"
          echo "modules=$(tr ' ' '\n' <<< "$targets" | grep -v '^\./' | xargs)" >> "$GITHUB_OUTPUT"

      # Builds every test binary and runs none, so a test that does not compile
      # fails the job in a minute instead of after the half-hour run.
      - name: Compile tests
        if: steps.affected.outputs.pkgs != ''
        run: go test -count=1 -exec /bin/true ${{ steps.affected.outputs.pkgs }}

      - name: Test
        if: steps.affected.outputs.pkgs != ''
        # A package that still needs a server starts its own; the engines on
        # tapes (pg, Trino, OceanBase, the MySQL family) start none. go test's
        # default 10m per package is too tight: oracle/review takes 7 min, and
        # over 10 on a busy runner. 20m leaves room and still lets a hung
        # package print its goroutine dump before the job's 30-minute cap.
        run: go test -p=8 -count=1 -timeout=20m ${{ steps.affected.outputs.pkgs }}

      - name: Nested modules (own go.mod, not reached by ./...)
        if: steps.affected.outputs.modules != ''
        run: |
          status=0
          for m in ${{ steps.affected.outputs.modules }}; do
            (cd "$m" && go test -count=1 ./...) || status=1
          done
          exit "$status"
