name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # One job on the org's self-hosted runners. A PR runs the tests of the
    # engines it touches (scripts/affected-packages.sh); a push to main runs
    # everything. Every test runs here; nothing is skipped and nothing is nightly.
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      # Sweep sizes the old nightly used; they add ~20 s here, so every PR gets them.
      PAREN_FUZZ_SIZE: '10000'
      SPLITTEST_N: '1000000'
      S3DIFF_N: '2000'
      WALK_SWEEP_N: '500'
      # OceanBase's sweep takes its changes one at a time on its one server, about
      # 5 s each on a busy runner, where the other engines spread theirs over
      # several; 500 would take 40 minutes.
      WALK_SWEEP_N_OCEANBASE: '40'
    services:
      trino:
        # The trino oracle tests need a live Trino; the runner waits for the
        # image's health check. Keep the tag in sync with trinooracle.DefaultImage.
        image: trinodb/trino:482
        ports: ['8080']
      spanner:
        # The googlesql differentials record verdicts from this exact emulator
        # build (sha256:caf1bd24…); newer builds drift, so keep it pinned.
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.54
        ports: ['9010']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # affected-packages.sh diffs against the base branch

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false # the runner keeps GOCACHE/GOMODCACHE between runs

      - name: Generated code and proto are in sync
        run: |
          go generate ./pg/ast/... ./mysql/ast/... ./mssql/ast/...
          make proto proto-breaking
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Build
        run: go build ./...

      - name: Affected packages
        id: affected
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            pkgs=$(scripts/affected-packages.sh origin/${{ github.base_ref }})
          else
            pkgs=./...
          fi
          echo "pkgs=$pkgs" | tee -a "$GITHUB_OUTPUT"

      # The packages internal/sharedserver serves share one MySQL 8.0 here, each
      # in its own database, so a PR that touches none of them boots nothing. A
      # service would start on every run, whatever the PR touched.
      - name: Shared MySQL 8.0
        if: steps.affected.outputs.pkgs != ''
        run: |
          go list ${{ steps.affected.outputs.pkgs }} | grep -qE '/(mysql/parser|oceanbase/parser|tidb/parser|internal/sharedserver)$' || exit 0
          name=omni-ci-mysql80-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          docker run -d --name "$name" -e MYSQL_ROOT_PASSWORD=test -p 127.0.0.1::3306 mysql:8.0 --skip-log-bin --max-connections=1000
          for _ in $(seq 180); do
            docker exec "$name" mysql -uroot -ptest --protocol=tcp -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          port=$(docker port "$name" 3306/tcp | head -1 | sed 's/.*://')
          echo "OMNI_SHARED_MYSQL80_DSN=root:test@tcp(127.0.0.1:$port)/" >> "$GITHUB_ENV"

      # The packages that talk to OceanBase run on one server here, one package at
      # a time: the review walk drops every user database between cases. SLIM boots
      # from the image's prebuilt store in about 30 s and stays near 3.5 GiB.
      - name: OceanBase
        if: steps.affected.outputs.pkgs != ''
        run: |
          go list ${{ steps.affected.outputs.pkgs }} | grep -qE '/(oceanbase/parser|oceanbase/catalog|oceanbase/review|oceanbase/validate|internal/sharedserver)$' || exit 0
          name=omni-ci-oceanbase-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          image=$(sed -n 's/^const OceanBaseImage = "\(.*\)"$/\1/p' internal/sharedserver/oceanbase.go)
          # The deployer refuses fewer than 20000 open files.
          docker run -d --name "$name" -e MODE=SLIM --ulimit nofile=65536:65536 -p 127.0.0.1::2881 "$image"
          for _ in $(seq 300); do
            docker logs "$name" 2>&1 | grep -q 'boot success!' && break
            sleep 1
          done
          # internal/sharedserver.oceanBaseSetup says why.
          docker exec "$name" obclient -h127.1 -P2881 -uroot@sys -e "ALTER SYSTEM SET datafile_maxsize = '8G'"
          docker exec "$name" obclient -S /root/demo/run/sql.sock -uroot@test -e "SET GLOBAL secure_file_priv = '/'"
          port=$(docker port "$name" 2881/tcp | head -1 | sed 's/.*://')
          echo "OCEANBASE_WALK_DSN=root@test:@tcp(127.0.0.1:$port)/" >> "$GITHUB_ENV"
          echo "OMNI_SHARED_OCEANBASE_DSN=root@test:@tcp(127.0.0.1:$port)/" >> "$GITHUB_ENV"

      - name: Test
        if: steps.affected.outputs.pkgs != ''
        env:
          TRINO_ORACLE_URL: http://localhost:${{ job.services.trino.ports['8080'] }}
          SPANNER_EMULATOR_HOST: localhost:${{ job.services.spanner.ports['9010'] }}
        # The trino packages share the one Trino service and run stateful DDL
        # against the same names, so they run one at a time, after the rest.
        # go test's default 10m per package is too tight: since its WALK_THROUGH
        # sweep, oracle/review takes 7 min, and over 10 on a busy runner. 20m leaves
        # room and still lets a hung package print its goroutine dump before
        # the job's 30-minute cap. The OceanBase packages share their one server
        # beside the rest rather than after them: the ones that keep to databases
        # of their own run together, then oceanbase/review alone, since its walk
        # drops every user database between cases.
        run: |
          pkgs=$(go list ${{ steps.affected.outputs.pkgs }})
          ob='/(oceanbase/parser|oceanbase/catalog|oceanbase/review|oceanbase/validate|internal/sharedserver)$'
          walk='/oceanbase/review$'
          (
            s=0
            { grep -E "$ob" <<< "$pkgs" | grep -vE "$walk" || true; } | xargs -r go test -p=4 -count=1 -timeout=20m || s=1
            { grep -E "$walk" <<< "$pkgs" || true; } | xargs -r go test -p=1 -count=1 -timeout=20m || s=1
            exit "$s"
          ) &
          oceanbase=$!
          status=0
          { grep -v /trino/ <<< "$pkgs" | grep -vE "$ob" || true; } | xargs -r go test -p=8 -count=1 -timeout=20m || status=1
          { grep /trino/ <<< "$pkgs" || true; } | xargs -r go test -p=1 -count=1 -timeout=20m || status=1
          wait "$oceanbase" || status=1
          exit "$status"

      - name: Remove the shared MySQL 8.0 and OceanBase
        if: always()
        run: docker rm -f "omni-ci-mysql80-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "omni-ci-oceanbase-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true

      - name: Nested modules (own go.mod, not reached by ./...)
        env:
          SPANNER_EMULATOR_HOST: localhost:${{ job.services.spanner.ports['9010'] }}
        run: |
          (cd harness/conformance && go test -count=1 ./...)
          (cd harness/googlesql-spanner && go test -count=1 ./...)
