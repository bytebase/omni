name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # One job on the org's self-hosted runners. A PR runs the tests of the
    # engines it touches (scripts/affected-packages.sh); a push to main runs
    # everything. There is no -short and no nightly: every test runs here.
    runs-on: self-hosted
    timeout-minutes: 30
    services:
      trino:
        # The trino oracle tests need a live Trino; the runner waits for the
        # image's health check. Keep the tag in sync with trinooracle.DefaultImage.
        image: trinodb/trino:482
        ports: ['8080']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # affected-packages.sh diffs against the base branch

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false # the runner keeps GOCACHE/GOMODCACHE between runs

      - name: Generated code and proto are in sync
        run: |
          go generate ./pg/ast/... ./mysql/ast/... ./mssql/ast/...
          make proto proto-breaking
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Build
        run: go build ./...

      - name: Affected packages
        id: affected
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            pkgs=$(scripts/affected-packages.sh origin/${{ github.base_ref }})
          else
            pkgs=./...
          fi
          echo "pkgs=$pkgs" | tee -a "$GITHUB_OUTPUT"

      - name: Test
        if: steps.affected.outputs.pkgs != ''
        env:
          TRINO_ORACLE_URL: http://localhost:${{ job.services.trino.ports['8080'] }}
        run: go test -p=8 -timeout 25m ${{ steps.affected.outputs.pkgs }}

      - name: PG and Redshift oracle differentials (-tags=oracle)
        if: contains(steps.affected.outputs.pkgs, './pg/') || contains(steps.affected.outputs.pkgs, './redshift/') || steps.affected.outputs.pkgs == './...'
        env:
          PAREN_FUZZ_SIZE: '1000'
        run: go test -tags=oracle -timeout 25m -run '^(TestParenOracle|TestFunctionBodyReferenceOracle|TestLoaderCompat|TestS3)' ./pg/parser/ ./pg/catalog/ ./pg/splittest/ ./redshift/parser/ ./redshift/catalog/

      - name: Conformance harness (own module)
        run: harness/conformance/fetch_corpus.sh && cd harness/conformance && go test -timeout 10m ./...

      - name: Build-tagged test code compiles
        run: |
          go test -tags=oracle -run '^$' ./pg/parser/ ./pg/catalog/ ./pg/splittest/ ./redshift/parser/ ./redshift/catalog/
          go test -tags=oracle_ref -run '^$' ./oracle/parser/
          go test -tags=scriptdom -run '^$' ./mssql/parser/
          go test -tags=googlesql_oracle -run '^$' ./googlesql/parser/ ./googlesql/analysis/
