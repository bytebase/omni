name: Nightly

# Wide-N and reference-engine sweeps that are too slow, or not yet green, for
# the per-PR gate in ci.yml. Every ordinary test, container-backed ones
# included, runs on each PR there; the -tags=oracle_ref lane below is the only
# test lane that runs nowhere else. Hosted runners are free for a public repo
# and these jobs are on nobody's critical path, so they stay off the
# self-hosted pool.

on:
  schedule:
    # Run daily at 08:00 UTC (17:00 JST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  oracle-ref-tests:
    # Oracle 23ai Free reference differential (-tags=oracle_ref).
    # ORACLE_PARSER_REF_CONTAINER=1 makes the harness start a
    # gvenzl/oracle-free container instead of requiring an external
    # DSN.
    # Schedule/dispatch-only for now: the first CI run surfaced two
    # corpus mismatches (ref_006, ref_030) where Oracle rejects due to
    # session state (invalid trigger, type-body compile error) while
    # omni accepts — pre-existing, needs triage. Flip to PR + required
    # once the corpus is green.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        go-version: ['1.25']
    env:
      ORACLE_PARSER_REF_CONTAINER: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Oracle reference tests (-tags=oracle_ref)
        run: go test -tags=oracle_ref -timeout 35m -v ./oracle/... -count=1

  splittest-nightly:
    # PG splitter framework at nightly scale: 10^6 constructive cases
    # (self-verifying expected boundaries) + byte-mutation invariants.
    # PR runs use the in-repo default N=10^4; see pg/splittest/.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go-version: ['1.25']
    env:
      SPLITTEST_N: '1000000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: PG splitter framework (nightly N=10^6)
        run: go test ./pg/splittest/ -count=1 -v

  splittest-s3-differential:
    # S3 server-side differential (framework G4): generated scripts
    # dual-run against PG 17 — the server's own error positions audit
    # our segment boundaries. Nightly N=2000.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go-version: ['1.25']
    env:
      S3DIFF_N: '2000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: S3 server-side differential (N=2000)
        run: go test -tags=oracle ./pg/splittest/ -run 'TestS3' -count=1 -v

  paren-fuzz-nightly:
    # SCENARIOS-pg-paren-dispatch.md §5.2 — wide-N nightly fuzz run.
    # N=10000 catches low-frequency paren-dispatch drift that the
    # PR-gate N=1000 misses. Still uses PAREN_FUZZ_DEFER so a single
    # fresh mismatch doesn't auto-fail the nightly build; the
    # timestamped artefact under testdata/paren-fuzz-defer/ is the
    # triage signal.
    # Skipped on pull_request: ci.yml already runs the N=1000 PR gate,
    # and the wide-N run takes up to 55 minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        go-version: ['1.25']
    env:
      PAREN_FUZZ_SIZE: '10000'
      PAREN_FUZZ_DEFER: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Paren fuzz nightly (N=10000, defer mode)
        run: go test -tags=oracle -timeout 55m -run TestParenOracleFuzz ./pg/parser/... -count=1 -v

      - name: Upload deferred-mismatch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paren-fuzz-defer-nightly
          path: pg/parser/testdata/paren-fuzz-defer/*.txt
          if-no-files-found: ignore

  tidb-catalog-parity:
    # tidb/catalog's differential tests were forked from mysql/catalog and
    # still carry MySQL-shaped expectations: 93 of them fail against TiDB
    # v8.5.5. startContainer skips them unless TIDB_CATALOG_PARITY=1 so the
    # PR gate stays green; this job runs them nightly so the mismatch count
    # is tracked. Move the family into ci.yml once it is green.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIDB_CATALOG_PARITY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: TiDB catalog parity (expected to fail until the family is fixed)
        run: go test -timeout 15m -v ./tidb/catalog/ -count=1
