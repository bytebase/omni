    CREATE TABLE tr_log (id INT AUTO_INCREMENT PRIMARY KEY, msg VARCHAR(100));
    CREATE TRIGGER trg_bi BEFORE INSERT ON tr FOR EACH ROW SET NEW.updated = NOW();
    CREATE TRIGGER trg_bi2 BEFORE INSERT ON tr FOR EACH ROW FOLLOWS trg_bi SET NEW.n = COALESCE(NEW.n, 0);
