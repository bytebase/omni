    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

    --
    -- Table structure for `employees`
    --
    CREATE TABLE `employees` (
      `id` int NOT NULL AUTO_INCREMENT,
      `name` varchar(100) NOT NULL,
      `department_id` int DEFAULT (NULL),
      `salary` decimal(10,2) DEFAULT (NULL),
      `hire_date` date DEFAULT (NULL),
      PRIMARY KEY (`id`),
      KEY `idx_dept` (`department_id`),
      CONSTRAINT `fk_dept` FOREIGN KEY (`department_id`) REFERENCES `departments` (`id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

    --
    -- View structure for `dept_employee_count`
    --
    CREATE OR REPLACE VIEW `dept_employee_count` AS select `d`.`id` AS `dept_id`,`d`.`name` AS `dept_name`,count(`e`.`id`) AS `emp_count` from (`departments` `d` left join `employees` `e` on((`d`.`id` = `e`.`department_id`))) group by `d`.`id`,`d`.`name`;

    --
    -- View structure for `dept_manager_summary`
    --
    CREATE OR REPLACE VIEW `dept_manager_summary` AS select `ds`.`dept_id` AS `dept_id`,`ds`.`dept_name` AS `dept_name`,`ds`.`emp_count` AS `emp_count`,`ds`.`avg_salary` AS `avg_salary`,`m`.`name` AS `manager_name` from ((`dept_summary` `ds` join `departments` `d` on((`ds`.`dept_id` = `d`.`id`))) left join `employees` `m` on((`d`.`manager_id` = `m`.`id`)));

    --
    -- View structure for `dept_summary`
    --
    CREATE OR REPLACE VIEW `dept_summary` AS select `dept_employee_count`.`dept_id` AS `dept_id`,`dept_employee_count`.`dept_name` AS `dept_name`,`dept_employee_count`.`emp_count` AS `emp_count`,0 AS `avg_salary`,0 AS `max_salary`,0 AS `min_salary` from `dept_employee_count`;

